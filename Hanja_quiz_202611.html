<title>한자 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E5%8D%81%E6%97%A5%E6%9C%88%E7%81%AB%E6%B0%B4%E6%9C%A8%E9%87%91%E5%9C%9F%E5%B1%B1%E7%99%BD%E9%9D%91%E4%BA%BA%E7%88%B6%E6%AF%8D%E5%85%84%E5%BC%9F%E5%A5%B3%E7%8E%8B%E6%B0%91%E5%85%88%E7%94%9F%E6%9D%B1%E8%A5%BF%E5%8D%97%E5%8C%97%E4%B8%AD%E5%A4%A7%E5%B0%8F%E9%95%B7%E5%A4%96%E5%AF%B8%E5%AD%B8%E6%A0%A1%E6%95%8E%E5%AE%A4%E9%96%80%E5%9C%8B%E9%9F%93%E8%BB%8D%E5%B9%B4%E8%90%AC">
<style>
/* Layout: 첫 화면(붓 친구·Day1~5) → 한 화면에 한 문제(한자 보고 뜻과 소리 고르기) → 완료 → 축하 */
:root {
  --bg: #F7F0E3; --card: #FFFFFF; --ink: #2E2A25; --muted: #6E665B; --line: #E8DAC2;
  --accent: #4F5868; --accent-ink: #FFFFFF; --sun: #D2B88E; --sun-soft: #F2E7D3;
  --good: #2B8A6B; --good-soft: #E2F5EE; --pink: #F5A9BF; --face: #FFFFFF;
  --tried: #F9CFDC; --tried-soft: #FFF6F9; --mark: #FFE3EC; --mark-line: #E7799D;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --hanja: "Noto Serif KR", "Batang", "AppleMyungjo", "Noto Serif CJK KR", serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; font-size: 34px; color: var(--accent); }
.nw { white-space: nowrap; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--display); color: var(--muted); font-variant-numeric: tabular-nums; font-size: 20px; }
.bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.link { background: none; border: 0; color: var(--muted); font-family: var(--display); font-size: 17px; cursor: pointer; padding: 4px 0; text-decoration: none; }

/* 첫 화면 */
.hero { align-items: center; text-align: center; background: linear-gradient(180deg, var(--sun-soft), var(--card)); border-color: var(--sun); }
.mascot { width: 260px; height: auto; max-width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; border: 4px solid var(--sun); padding: 6px; display: block; }
.mascot.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.date { font-family: var(--display); font-size: 22px; margin: 0; }
.lead { margin: 0; font-size: 19px; }
.days { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.day {
  width: calc((100% - 20px) / 3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 6px; border-radius: 18px;
  background: var(--card); color: var(--ink); border: 3px solid var(--line); font-family: var(--display); cursor: pointer;
}
.day .dimg { width: 72%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; display: block; margin-bottom: 4px; }
.day .d { font-size: 24px; color: var(--accent); white-space: nowrap; }
.day .s { font-size: 15px; color: var(--muted); font-family: var(--body); white-space: nowrap; }
.day.done { border-color: var(--good); background: var(--good-soft); }
.day.done .d { color: var(--good); }
.day.next { border-color: var(--sun); }
.day:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* 문제 */
.sec { font-family: var(--display); color: var(--accent); font-size: 16px; letter-spacing: .02em; }
.q { font-size: 23px; margin: 0; text-wrap: pretty; }
.qnum {
  display: inline-block; font-family: var(--display); font-size: 18px; line-height: 1;
  background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 12px 5px; margin-right: 10px; vertical-align: 3px;
}
.box { background: var(--sun-soft); border: 3px solid var(--sun); border-radius: 18px; padding: 22px 16px; text-align: center; }
.sentence { font-family: var(--display); font-size: 32px; line-height: 1.6; margin: 0; text-wrap: balance; word-break: keep-all; }
.wrong { background: var(--mark); color: #B23A62; border-bottom: 4px solid var(--mark-line); border-radius: 6px; padding: 0 4px; }
.fixed { background: var(--good-soft); color: var(--good); border-bottom: 4px solid var(--good); border-radius: 6px; padding: 0 4px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  font-family: var(--display); font-size: 26px; line-height: 1.3; color: var(--ink);
  background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 12px 14px;
}
.opt .no {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-size: 18px; background: var(--sun-soft); color: var(--accent);
}
.opt:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.opt.tried { border-style: dashed; border-color: var(--tried); background: var(--tried-soft); color: var(--muted); cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .no { background: var(--good); color: #FFFFFF; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button.btn {
  font-family: var(--display); font-size: 20px; border: 0; border-radius: 14px; padding: 10px 22px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
button.btn.soft { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
button.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* 완료·축하 */
.center { text-align: center; align-items: center; }
.big { font-family: var(--display); font-size: 56px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.celebrate { background: var(--sun-soft); border-color: var(--sun); }
.celebrate h2 { font-size: 38px; }
.celebrate .art { display: flex; align-items: center; justify-content: center; gap: 8px; }
.celebrate .trophy { width: 170px; max-width: 100%; height: auto; animation: pop .6s ease-out; }
.celebrate .mascot { width: 180px; }
@keyframes pop { 0% { transform: scale(.6); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
.badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.badges span { font-family: var(--display); background: var(--card); border: 2px solid var(--good); color: var(--good); border-radius: 99px; padding: 2px 14px; }
details { width: 100%; text-align: left; border-top: 2px dashed var(--line); padding-top: 12px; }
summary { cursor: pointer; font-family: var(--display); color: var(--muted); }
.tbl { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; } th { color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: 15px; margin: 0; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* 피드백 팝업 (파스텔 분홍, 화면 가운데) */
.pop-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(30, 58, 82, .2);
  display: flex; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.pop {
  width: 100%; max-width: 640px; background: #FFF1F5; border: 4px solid #F9CFDC; border-radius: 26px;
  padding: 18px 20px 20px; text-align: center; color: var(--ink);
  box-shadow: 0 8px 30px rgba(214, 140, 166, .3); animation: rise .28s ease-out; max-height: 100%; overflow-y: auto;
}
.pop-face { font-size: 40px; line-height: 1; }
.pop-img { width: 150px; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; border: 3px solid #F9CFDC; display: block; margin: 0 auto 4px; }
.pop strong { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; color: #B8577A; margin: 6px 0 4px; text-wrap: balance; }
.pop p { margin: 0 0 14px; font-size: 21px; line-height: 1.55; text-wrap: pretty; word-break: keep-all; }
.pop b { font-family: var(--display); font-weight: 400; color: var(--good); }
.pop-btns { display: flex; flex-direction: column; gap: 10px; }
.pop .btn { width: 100%; background: #F7C3D4; color: #6E2A44; min-height: 56px; font-size: 24px; }
.pop .btn.soft { background: #FFFFFF; color: #9E4A69; border: 3px solid #F7C3D4; }
@keyframes rise { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 한자 */
.hanja { font-family: var(--hanja); font-weight: 700; font-size: 120px; line-height: 1.15; margin: 0; color: var(--ink); }
.meaning { font-family: var(--display); font-size: 26px; margin: 6px 0 0; color: var(--muted); }
.meaning.on { color: var(--good); }
.pc { font-family: var(--hanja); font-weight: 700; font-size: 36px; vertical-align: -3px; margin-right: 6px; color: var(--ink); }

/* 휴대폰(세로 화면 또는 좁은 화면): 화면 폭에 비례해 크기를 정한다. 반드시 스타일 맨 끝에 둔다. */
@media (max-width: 560px), (orientation: portrait) {
  body { font-size: clamp(20px, 5.2vw, 42px); padding-top: calc(3vw + env(safe-area-inset-top, 0px)); }
  .wrap { max-width: none; gap: 3.5vw; }
  .card { padding: 4.5vw; border-radius: 5vw; gap: 3.8vw; }
  .mascot { width: 58vw; }
  h2 { font-size: clamp(30px, 8.5vw, 68px); line-height: 1.3; }
  .date { font-size: clamp(20px, 5.8vw, 46px); }
  .lead { font-size: clamp(19px, 5.6vw, 44px); }
  .bar { height: clamp(10px, 2.6vw, 20px); }
  .days { gap: 2.6vw; }
  .day { width: calc((100% - 5.2vw) / 3); padding: 3.4vw 1.5vw; min-height: 20vw; border-radius: 4vw; }
  .day .d { font-size: clamp(18px, 5.8vw, 46px); }
  .day .s { font-size: clamp(12px, 3.6vw, 28px); }
  .sec { font-size: clamp(16px, 4.8vw, 38px); }
  .q { font-size: clamp(20px, 5.8vw, 46px); line-height: 1.5; }
  .qnum { font-size: clamp(18px, 5.4vw, 42px); padding: 1.4vw 3vw 1.2vw; margin-right: 2vw; vertical-align: .5vw; }
  .box { padding: 5.5vw 4vw; border-radius: 5vw; }
  .sentence { font-size: clamp(24px, 7.6vw, 60px); }
  .hanja { font-size: clamp(90px, 34vw, 260px); }
  .meaning { font-size: clamp(22px, 7vw, 56px); }
  .pc { font-size: clamp(30px, 9vw, 72px); }
  .opts { gap: 2.8vw; }
  .opt { font-size: clamp(22px, 7vw, 56px); padding: 3vw 3.6vw; border-radius: 4vw; gap: 3vw; min-height: 16vw; }
  .opt .no { width: 9vw; height: 9vw; font-size: clamp(16px, 5vw, 40px); }
  .btns { flex-direction: column; gap: 2.6vw; }
  .btns button.btn { width: 100%; min-height: 15vw; font-size: clamp(22px, 6.4vw, 50px); border-radius: 4vw; }
  .link, .top .count { font-size: clamp(18px, 5vw, 40px); }
  .big { font-size: clamp(54px, 16vw, 120px); }
  .celebrate h2 { font-size: clamp(32px, 9.5vw, 74px); }
  .celebrate .trophy { width: 40vw; }
  .celebrate .mascot { width: 42vw; }
  .badges span { font-size: clamp(16px, 4.8vw, 38px); padding: .6vw 3.6vw; }
  summary { font-size: clamp(17px, 5vw, 40px); }
  .note, table { font-size: clamp(14px, 4.2vw, 32px); }
  .pop { border-radius: 6vw; padding: 4.5vw 5vw 5vw; }
  .pop-face { font-size: clamp(36px, 10vw, 80px); }
  .pop-img { width: 38vw; }
  .pop strong { font-size: clamp(25px, 7.6vw, 60px); }
  .pop p { font-size: clamp(20px, 6vw, 48px); margin-bottom: 4vw; }
  .pop .btn { min-height: 15vw; font-size: clamp(22px, 6.6vw, 52px); border-radius: 4vw; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .celebrate .trophy, .mascot.bob, .pop { animation: none; } }
</style>
</head>

const QS = RAW.map(([sec, c, right, w1, w2, hint], i) => {
  const raw = [right, w1, w2], order = PERMS[(i * 5 + 2) % 6];
  return {n: i + 1, sec, c, opts: order.map(k => raw[k]), ans: order.indexOf(0), right, hint};
});
// 하루 20문제: 50자를 두 번씩(100문제) 무작위로 섞어 5일에 나눈다. 하루 안에서는 같은 글자가 두 번 나오지 않는다
const PER_DAY = 20;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function makePlan() {
  const ns = QS.map(q => q.n);
  for (;;) {
    const seq = [...shuffle(ns), ...shuffle(ns)];
    const days = [0, 1, 2, 3, 4].map(k => seq.slice(k * PER_DAY, (k + 1) * PER_DAY));
    if (days.every(d => new Set(d).size === PER_DAY)) return days;
  }
}

    const k = "study-today-v1", n = new Date(), day = n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate();
    let s = JSON.parse(localStorage.getItem(k)) || {};

    const a = s.done[subj] || (s.done[subj] = []);
    if (!a.includes(label)) a.push(label);
    localStorage.setItem(k, JSON.stringify(s));
  } catch (e) {}

function startDay(k) {
  cur = k;
  if (state.days[k].done) { state.days[k] = {i: 0, res: {}, done: false}; state.plan[k] = shuffle(state.plan[k]); }
  save(); renderQ(); window.scrollTo(0, 0);
}

function renderQ() {
  closePopup();
  const d = state.days[cur];
  if (d.i >= PER_DAY) return finishDay();
  const q0 = QS[state.plan[cur][d.i] - 1], o = shuffle([0, 1, 2]); tries = 0;
  const q = {...q0, opts: o.map(k => q0.opts[k]), ans: o.indexOf(q0.ans)};
  main.innerHTML = `<div class="top"><button class="link" id="home">← 처음 화면</button><span class="count">Day ${cur + 1} · ${d.i + 1} / 20</span></div>

    <section class="card"><div class="sec">${SEC[q.sec][0]}</div>

  $("home").addEventListener("click", renderHome);
  main.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(q, b)));
}

function choose(q, btn) {
  if (btn.classList.contains("tried") || btn.classList.contains("right")) return;
  const k = Number(btn.dataset.k), res = state.days[cur].res;
  tries++;
  if (k === q.ans) {
    if (!(q.n in res)) res[q.n] = tries === 1;
    save();
    btn.classList.add("right");
    main.querySelectorAll(".opt").forEach(b => b.disabled = true);
    reveal(q);
    const extra = tries > 1 ? " 포기하지 않고 다시 찾아냈네!" : "";
    popup("good", CHEERS[Math.floor(Math.random() * CHEERS.length)],
      `<span class="pc">${q.c}</span><b>${q.right}</b><br>${SEC[q.sec][1]}${extra}`, [nextAction()]);
    return;
  }
  btn.classList.add("tried"); btn.setAttribute("aria-disabled", "true");
  const acts = [["다시 해 볼게!", () => {}]];
  if (tries >= 2) acts.push(["같이 정답 보기", () => showAnswer(q), "soft"]);
  popup("try", `괜찮아 ${NAME}야,<br>다시 생각해 볼까?`, `힌트: ${q.hint}`, acts);
}

function showAnswer(q) {
  const res = state.days[cur].res;
  if (!(q.n in res)) res[q.n] = false;
  save();
  main.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (Number(b.dataset.k) === q.ans) b.classList.add("right"); });
  reveal(q);
  popup("good", `${NAME}야, 같이 정답을 봐요`,
    `<span class="pc">${q.c}</span><b>${q.right}</b><br>${q.hint}<br>다음엔 ${NAME}가 바로 맞힐 수 있을 거야!`, [nextAction()]);
}

function nextAction() {
  const last = state.days[cur].i === PER_DAY - 1;
  return [last ? `Day ${cur + 1} 끝내기` : "다음 문제", () => { state.days[cur].i++; save(); renderQ(); window.scrollTo(0, 0); }];
}

function popup(kind, title, body, actions) {
  closePopup();
  const bg = document.createElement("div");
  bg.className = "pop-bg"; bg.id = "pop";
  const face = kind === "good" && cur !== null ? `<img class="pop-img" src="${MASCOT_SRC}" alt="웃고 있는 먹물 붓 친구" width="150" height="150">` : `<div class="pop-face" aria-hidden="true">💗</div>`;
  bg.innerHTML = `<div class="pop ${kind}" role="alertdialog" aria-modal="true" aria-labelledby="pop-t" aria-describedby="pop-b">
    ${face}<strong id="pop-t">${title}</strong><p id="pop-b">${body}</p><div class="pop-btns"></div></div>`;
  const box = bg.querySelector(".pop-btns");
  actions.forEach(([label, fn, style]) => {
    const b = document.createElement("button");
    b.className = "btn " + (style || ""); b.textContent = label;
    b.addEventListener("click", () => { closePopup(); fn(); });
    box.appendChild(b);
  });

}

function recordTable(dayIdx) {
  const rows = [];
  dayIdx.forEach(k => state.plan[k].forEach((n, pos) => {
    const r = state.days[k].res[n], q = QS[n - 1];
    if (r !== true) rows.push(`<tr><td>Day ${k + 1} · ${pos + 1}번</td><td>${q.c} ${q.right}</td><td>${SEC[q.sec][0]}</td><td>${r === false ? "다시 생각하거나 함께 정답 봄" : "풀지 않음"}</td></tr>`);
  }));
  return `<details><summary>보호자·선생님용 기록</summary>
    <p class="note">처음 시도에서 맞히지 못한 문제입니다. 이 기록은 이 브라우저에만 남습니다.</p>

}

  const total = state.plan.reduce((s, _, k) => s + score(k), 0);
  main.innerHTML = `<section class="card center celebrate">
    <div class="art">${TROPHY}${MASCOT("먹물 붓 친구가 축하하는 그림")}</div>
    <h2><span class="nw">축하해,</span> <span class="nw">${NAME}야!</span></h2>
    <p class="q">5일 동안 한자 50자를 두 번씩, 100문제를 모두 풀었어! 이제 ${NAME}는 한자 박사야.</p>
    <div class="badges">${state.plan.map((_, k) => `<span>Day ${k + 1} ✓</span>`).join("")}</div>
    <p class="lead">처음에 바로 맞힌 문제: <b>${total} / 100</b></p>
    ${recordTable([0, 1, 2, 3, 4])}
    <div class="btns"><button class="btn" id="home">처음 화면으로</button><button class="btn soft" id="reset">처음부터 다시 시작</button></div></section>`;
  $("home").addEventListener("click", renderHome);
  $("reset").addEventListener("click", () => { state = fresh(); save(); renderHome(); });
  confetti();
  window.scrollTo(0, 0);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#D2B88E", "#F5A9BF", "#4F5868", "#2B8A6B", "#FFE08A"];
  const ps = Array.from({length: 140}, () => ({x: Math.random() * W, y: -20 - Math.random() * H * .6, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], s: 6 + Math.random() * 6}));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - start < 4500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(start);
}

renderHome();
</script>
</body>
