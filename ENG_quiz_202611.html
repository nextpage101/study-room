<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 읽기/듣기 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFF0E4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: 첫 화면(시나모롤·날짜·Day 버튼) → 하루 10문제(영어 문장 1개 + 해석 보기 3개) → 하루 완료 → 5일 모두 완료 시 축하 */
:root {
  --bg: #FFF0E4; --card: #FFFFFF; --ink: #4A2E1E; --muted: #89634E; --line: #F9D8BF;
  --accent: #B4561F; --accent-ink: #FFFFFF; --sun: #F4B184; --sun-soft: #FDE5D2;
  --good: #2B8A6B; --good-soft: #E2F5EE; --pink: #F5A9BF; --face: #FFFFFF;
  --tried: #F9CFDC; --tried-soft: #FFF6F9;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --en: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
}
/* 기기가 어두운 화면 모드여도 하늘색·흰색 한 가지로만 보이게 한다. */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; font-size: 34px; color: var(--accent); }
.nw { white-space: nowrap; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--display); color: var(--muted); font-variant-numeric: tabular-nums; font-size: 20px; }
.bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

/* 첫 화면 */
.hero { align-items: center; text-align: center; background: linear-gradient(180deg, var(--sun-soft), var(--card)); border-color: var(--sun); }
.art { display: flex; align-items: center; justify-content: center; gap: 8px; }
.mascot { width: 280px; height: auto; max-width: 100%; aspect-ratio: 1; object-fit: contain; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 4px solid var(--sun); padding: 6px; display: block; }
.mascot.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.date { font-family: var(--display); font-size: 22px; margin: 0; }
.lead { margin: 0; font-size: 19px; }
/* Day 버튼: 한 줄에 3개, 다음 줄에 2개(가운데 정렬) */
.days { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.day {
  width: calc((100% - 20px) / 3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 6px; border-radius: 18px;
  background: var(--card); color: var(--ink); border: 3px solid var(--line); font-family: var(--display); cursor: pointer;
}
.day .dimg { width: 72%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; display: block; margin-bottom: 4px; }
.day .d { font-size: 24px; color: var(--accent); }
.day .s { font-size: 15px; color: var(--muted); font-family: var(--body); }
.day.done { border-color: var(--good); background: var(--good-soft); }
.day.done .d { color: var(--good); }
.day.next { border-color: var(--sun); }
.day:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* 문제 */
.sec { font-family: var(--display); color: var(--accent); font-size: 16px; letter-spacing: .02em; }
.q { font-size: 23px; margin: 0; text-wrap: pretty; }
.qnum {
  display: inline-block; font-family: var(--display); font-size: 18px; line-height: 1;
  background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 12px 5px;
  margin-right: 10px; vertical-align: 3px;
}
.sentence {
  background: var(--sun-soft); border: 3px solid var(--sun); border-radius: 18px; padding: 18px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
}
.sentence .en { font-family: var(--en); font-weight: 800; font-size: 30px; line-height: 1.35; color: var(--ink); margin: 0; text-wrap: balance; }
.listen {
  font-family: var(--display); font-size: 19px; border: 2px solid var(--accent); background: var(--card); color: var(--accent);
  border-radius: 99px; padding: 6px 18px; cursor: pointer;
}
.listen:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.listen.big { font-size: 26px; padding: 12px 30px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hidden-en { font-family: var(--display); font-size: 24px; color: var(--muted); margin: 0; }
.mode { display: inline-block; border-radius: 99px; padding: 0 10px; }
.mode.m-listen { background: #FFF1F5; color: #B8577A; }
.mode.m-read { background: var(--sun-soft); color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  font-family: var(--body); font-size: 21px; line-height: 1.45; color: var(--ink);
  background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 12px 14px;
}
.opt .no {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-size: 18px; background: var(--sun-soft); color: var(--accent);
}
.opt:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.opt.tried { border-style: dashed; border-color: var(--tried); background: var(--tried-soft); color: var(--muted); cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .no { background: var(--good); color: #FFFFFF; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button.btn {
  font-family: var(--display); font-size: 20px; border: 0; border-radius: 14px; padding: 10px 22px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
button.btn.soft { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
button.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--muted); font-family: var(--display); font-size: 17px; cursor: pointer; padding: 4px 0; }

/* 하루 완료·축하 */
.center { text-align: center; align-items: center; }
.big { font-family: var(--display); font-size: 56px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.celebrate { background: var(--sun-soft); border-color: var(--sun); }
.celebrate h2 { font-size: 38px; }
.celebrate .trophy { width: 180px; max-width: 100%; height: auto; animation: pop .6s ease-out; }
@keyframes pop { 0% { transform: scale(.6); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
.badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.badges span { font-family: var(--display); background: var(--card); border: 2px solid var(--good); color: var(--good); border-radius: 99px; padding: 2px 14px; }
details { width: 100%; text-align: left; border-top: 2px dashed var(--line); padding-top: 12px; }
summary { cursor: pointer; font-family: var(--display); color: var(--muted); }
.tbl { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; } th { color: var(--muted); font-weight: 400; }
td.en { font-family: var(--en); font-weight: 700; }
.note { color: var(--muted); font-size: 15px; margin: 0; }
.voiceset { display: flex; flex-direction: column; gap: 8px; }
.voice-sel { width: 100%; font-size: 18px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 12px; background: #FFFFFF; color: var(--ink); margin: 4px 0 8px; }
.rate-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.rate { font-family: var(--display); font-size: 18px; border: 2px solid var(--line); border-radius: 99px; padding: 6px 16px; background: #FFFFFF; color: var(--ink); cursor: pointer; }
.rate.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.voiceset .note { font-size: 15px; line-height: 1.5; }
.voiceset .listen { align-self: flex-start; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* 피드백 팝업 (파스텔 분홍, 화면 가운데) */
.pop-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(30, 58, 82, .2);
  display: flex; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.pop {
  width: 100%; max-width: 640px; background: #FFF1F5; border: 4px solid #F9CFDC; border-radius: 26px;
  padding: 18px 20px 20px; text-align: center; color: var(--ink);
  box-shadow: 0 8px 30px rgba(214, 140, 166, .3); animation: rise .28s ease-out;
  max-height: 100%; overflow-y: auto;
}
.pop-face { font-size: 40px; line-height: 1; }
.pop-img { width: 150px; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; border: 3px solid #F9CFDC; display: block; margin: 0 auto 4px; }
.pop strong { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; color: #B8577A; margin: 6px 0 4px; text-wrap: balance; }
.pop p { margin: 0 0 14px; font-size: 21px; line-height: 1.55; text-wrap: pretty; }
.pop .en { font-family: var(--en); font-weight: 800; }
.pop-btns { display: flex; flex-direction: column; gap: 10px; }
.pop .btn { width: 100%; background: #F7C3D4; color: #6E2A44; min-height: 56px; font-size: 24px; }
.pop .btn.soft { background: #FFFFFF; color: #9E4A69; border: 3px solid #F7C3D4; }
@keyframes rise { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 휴대폰(세로 화면 또는 좁은 화면): 화면 폭에 비례해 크기를 정한다. 기본값을 덮어쓰도록 반드시 스타일 맨 끝에 둔다. */
@media (max-width: 560px), (orientation: portrait) {
  body { font-size: clamp(20px, 5.2vw, 42px); padding-block: 3vw 7vw; }
  .wrap { max-width: none; gap: 3.5vw; }
  .card { padding: 4.5vw; border-radius: 5vw; gap: 3.8vw; }
  .hero { gap: 3vw; }
  .mascot { width: 62vw; max-width: none; }
  h2 { font-size: clamp(30px, 8.5vw, 68px); line-height: 1.3; }
  .date { font-size: clamp(20px, 5.8vw, 46px); }
  .lead { font-size: clamp(19px, 5.6vw, 44px); }
  .bar { height: clamp(10px, 2.6vw, 20px); }
  .days { gap: 2.6vw; }
  .day { width: calc((100% - 5.2vw) / 3); padding: 3.4vw 1.5vw; min-height: 20vw; border-radius: 4vw; }
  .day .d { font-size: clamp(20px, 6.2vw, 48px); }
  .day .s { font-size: clamp(13px, 3.8vw, 30px); }
  .sec { font-size: clamp(16px, 4.8vw, 38px); }
  .q { font-size: clamp(20px, 5.8vw, 46px); line-height: 1.5; }
  .qnum { font-size: clamp(18px, 5.4vw, 42px); padding: 1.4vw 3vw 1.2vw; margin-right: 2vw; vertical-align: .5vw; }
  .sentence { padding: 5vw 4vw; border-radius: 5vw; gap: 3.5vw; }
  .sentence .en { font-size: clamp(26px, 7.8vw, 62px); }
  .listen { font-size: clamp(18px, 5.4vw, 42px); padding: 1.6vw 5vw; border-width: 3px; }
  .listen.big { font-size: clamp(24px, 7.4vw, 58px); padding: 3vw 8vw; }
  .hidden-en { font-size: clamp(20px, 6vw, 48px); }
  .mode { padding: 0 2.4vw; }
  .opts { gap: 2.8vw; }
  .opt { font-size: clamp(19px, 5.6vw, 44px); padding: 3.4vw 3.6vw; border-radius: 4vw; gap: 3vw; min-height: 16vw; }
  .opt .no { width: 9vw; height: 9vw; font-size: clamp(16px, 5vw, 40px); }
  .btns { flex-direction: column; gap: 2.6vw; }
  .btns button.btn { width: 100%; min-height: 15vw; font-size: clamp(22px, 6.4vw, 50px); border-radius: 4vw; }
  .link { font-size: clamp(18px, 5vw, 40px); }
  .top .count { font-size: clamp(18px, 5vw, 40px); }
  .big { font-size: clamp(54px, 16vw, 120px); }
  .celebrate h2 { font-size: clamp(32px, 9.5vw, 74px); }
  .celebrate .art { gap: 3vw; }
  .celebrate .trophy { width: 40vw; max-width: none; }
  .celebrate .mascot { width: 44vw; }
  .badges span { font-size: clamp(16px, 4.8vw, 38px); padding: .6vw 3.6vw; }
  summary { font-size: clamp(17px, 5vw, 40px); }
  .note { font-size: clamp(14px, 4.2vw, 32px); }
  table { font-size: clamp(14px, 4.2vw, 32px); }
  .pop { border-radius: 6vw; padding: 4.5vw 5vw 5vw; }
  .pop-face { font-size: clamp(36px, 10vw, 80px); }
  .pop-img { width: 38vw; }
  .pop strong { font-size: clamp(25px, 7.6vw, 60px); }
  .pop p { font-size: clamp(20px, 6vw, 48px); margin-bottom: 4vw; }
  .pop .btn { min-height: 15vw; font-size: clamp(22px, 6.6vw, 52px); border-radius: 4vw; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .celebrate .trophy, .mascot.bob, .pop { animation: none; } }
</style>
</head>

    <select id="voiceSel" class="voice-sel"></select>
    <div class="rate-row">${RATES.map(([t, r]) => `<button class="rate" data-r="${r}">${t}</button>`).join("")}</div>
    <button class="listen" id="voiceTest">🔊 들어 보기</button>
    <p class="note" id="voiceTip"></p></details>`;
}
function bindVoiceSet() {
  const sel = $("voiceSel"); if (!sel) return;
  const fill = () => {
    if (!$("voiceSel")) return;
    const vs = enVoices().slice().sort((a, b) => voiceScore(b) - voiceScore(a)), cur = pickVoice();
    sel.innerHTML = vs.length ? vs.map(v => `<option value="${v.voiceURI.replace(/"/g, "&quot;")}"${cur && v.voiceURI === cur.voiceURI ? " selected" : ""}>${v.name} (${v.lang})</option>`).join("") : `<option>기본 목소리</option>`;
    $("voiceTip").textContent = vs.length <= 1 ? "목소리가 하나뿐이라면 휴대폰 설정 → 글자 읽어주기(TTS)에서 영어 목소리를 내려받아 바꿀 수 있어요." : "";
    const r = voicePref.rate || 1;
    document.querySelectorAll(".rate").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
  };
  fill();
  try { speechSynthesis.addEventListener("voiceschanged", fill); } catch (e) {}
  sel.addEventListener("change", () => { voicePref.uri = sel.value; savePref(); speak(TEST_EN); });
  document.querySelectorAll(".rate").forEach(b => b.addEventListener("click", () => { voicePref.rate = Number(b.dataset.r); savePref(); fill(); speak(TEST_EN); }));
  $("voiceTest").addEventListener("click", () => speak(TEST_EN));
}function speak(text) {
  if (!CAN_SPEAK) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const base = document.getElementById("sent") ? 0.72 : 0.8; // 듣고 고르기는 조금 더 천천히
    u.lang = "en-US"; u.rate = base * (voicePref.rate || 1);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}

const TROPHY = `<svg class="trophy" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="트로피 그림">
  <g fill="var(--pink)"><path d="M30 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/><path d="M168 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/></g>
  <path d="M58 40 h84 v34 a42 42 0 0 1 -84 0z" fill="var(--sun)" stroke="var(--accent)" stroke-width="3"/>
  <path d="M58 50 h-18 a18 18 0 0 0 22 30" fill="none" stroke="var(--sun)" stroke-width="8"/>
  <path d="M142 50 h18 a18 18 0 0 1 -22 30" fill="none" stroke="var(--sun)" stroke-width="8"/>
  <rect x="90" y="114" width="20" height="26" fill="var(--sun)"/>
  <rect x="64" y="140" width="72" height="18" rx="6" fill="var(--accent)"/>
  <text x="100" y="152" text-anchor="middle" dominant-baseline="central" font-family="Jua, sans-serif" font-size="13" fill="var(--accent-ink)">${NAME}</text>
  <path d="M100 56 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z" fill="var(--face)"/>
</svg>`;

// 오늘 한 공부를 첫 화면(오늘의 공부)에 알려 주는 기록. 날짜가 바뀌면 새로 시작한다
function logToday(subj, label) {
  try {
    const k = "study-today-v1", n = new Date(), day = n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate();
    let s = JSON.parse(localStorage.getItem(k)) || {};
    if (s.date !== day || !s.done) s = {date: day, done: {}};
    const a = s.done[subj] || (s.done[subj] = []);
    if (!a.includes(label)) a.push(label);
    localStorage.setItem(k, JSON.stringify(s));
  } catch (e) {}
}function todayText() {
  const d = new Date(), w = "일월화수목금토"[d.getDay()];
  return `<span class="nw">${d.getFullYear()}년</span> <span class="nw">${d.getMonth() + 1}월 ${d.getDate()}일</span> <span class="nw">${w}요일</span>`;
}

function renderHome() {
  closePopup(); cur = null;
  const firstOpen = state.days.findIndex(d => !d.done);
  const allDone = firstOpen === -1;
  const cards = state.days.map((d, k) => {
    const score = DAYS[k].filter(n => d.res[n] === true).length;
    const sub = d.done ? `다 했어! ${score}/10` : d.i > 0 ? `${d.i}/10 하는 중` : "10문제";
    return `<button class="day ${d.done ? "done" : ""} ${k === firstOpen ? "next" : ""}" data-day="${k}" aria-label="Day ${k + 1}, ${sub}"><span class="d">Day ${k + 1}</span><span class="s">${sub}</span></button>`;
  }).join("");
  main.innerHTML = `
    <a class="link" href="index.html">← 과목 고르기</a>
    <section class="card hero">
      <div class="art">${MASCOT("비행기를 타고 지호를 반기는 시나모롤", "bob")}</div>
      <h2><span class="nw">오늘은</span> <span class="nw">영어 시간</span></h2>
      <p class="lead">우리 영어 문장 같이 읽고 들어 보자~</p>
    </section>
    <section class="days" aria-label="날짜별 문제">${cards}</section>
    ${allDone ? `<div class="btns"><button class="btn soft" id="party">축하 다시 보기</button></div>` : ""}
    ${voiceSetHTML()}`;
  bindVoiceSet();
  main.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => startDay(Number(b.dataset.day))));
  if (allDone) $("party").addEventListener("click", renderCelebrate);
}

function startDay(k) {
  cur = k;
  if (state.days[k].done) state.days[k] = {i: 0, res: {}, done: false};
  save(); renderQ(); window.scrollTo(0, 0);
}

function renderQ() {
  closePopup();
  const d = state.days[cur];
  if (d.i >= 10) return finishDay();
  const q = QS[DAYS[cur][d.i] - 1]; tries = 0;
  const listen = isListen(d.i);
  main.innerHTML = `<div class="top"><button class="link" id="home">← 처음 화면</button><span class="count">Day ${cur + 1} · ${d.i + 1} / 10</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${d.i * 10}%"></i></div>
    <section class="card"><div class="sec">${THEME[q.t]} · <span class="mode ${listen ? "m-listen" : "m-read"}">${listen ? "🎧 듣고 고르기" : "📖 읽고 고르기"}</span></div>
      <p class="q"><span class="qnum">${d.i + 1}번</span>${listen ? "잘 듣고, 알맞은 뜻을 골라 보세요." : "문장을 읽고, 알맞은 뜻을 골라 보세요."}</p>
      ${listen
        ? `<div class="sentence listen-mode"><p class="hidden-en" id="sent">소리를 잘 들어 봐!</p><button class="listen big" id="listen">🔊 들려줘</button></div>`
        : `<div class="sentence"><p class="en" lang="en">${q.en}</p>${CAN_SPEAK ? `<button class="listen" id="listen">🔊 듣기</button>` : ""}</div>`}
      <div class="opts" role="group" aria-label="뜻 고르기">
        ${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="no">${k + 1}</span><span>${o}</span></button>`).join("")}
      </div>
    </section>`;
  $("home").addEventListener("click", renderHome);
  if (CAN_SPEAK) $("listen").addEventListener("click", () => speak(q.en));
  main.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(q, b)));
  // 듣고 고르기 문제는 화면이 열리면 한 번 바로 들려준다 (기기가 막으면 '들려줘' 버튼으로 듣는다)
  if (listen) speak(q.en);
}

// 하루 10문제 중 짝수 번째(2·4·6·8·10번)는 듣고 고르기. 음성이 없는 기기에서는 모두 읽고 고르기.
function isListen(pos) { return CAN_SPEAK && pos % 2 === 1; }

// 듣고 고르기 문제에서 정답을 맞히거나 정답을 볼 때 문장을 보여 준다
function reveal(q) {
  const s = $("sent");
  if (!s) return;
  s.className = "en"; s.lang = "en"; s.textContent = q.en;
  const b = $("listen"); if (b) { b.classList.remove("big"); b.textContent = "🔊 다시 듣기"; }
}

function choose(q, btn) {
  if (btn.classList.contains("tried") || btn.classList.contains("right")) return;
  const k = Number(btn.dataset.k), res = state.days[cur].res;
  tries++;
  if (k === q.ans) {
    if (!(q.n in res)) res[q.n] = tries === 1;
    save();
    btn.classList.add("right");
    main.querySelectorAll(".opt").forEach(b => b.disabled = true);
    reveal(q);
    const extra = tries > 1 ? " 포기하지 않고 다시 읽어서 찾아냈네!" : "";
    popup("good", CHEERS[Math.floor(Math.random() * CHEERS.length)],
      `<span class="en">${q.key}</span> 뜻(${q.mean})을 잘 알고 있구나!${extra}`, [nextAction()]);
    return;
  }
  btn.classList.add("tried"); btn.setAttribute("aria-disabled", "true");
  const acts = [["다시 해 볼게!", () => {}]];
  if (tries >= 2) acts.push(["같이 정답 보기", () => showAnswer(q), "soft"]);
  const hint = $("sent")
    ? `잘 들어 봐. <span class="en">${q.key}</span>라는 말이 나와. 뜻은 '${q.mean}'${josa(q.mean, "이야", "야")}. 🔊 들려줘를 눌러 한 번 더 들어 볼까?`
    : `단어 <span class="en">${q.key}</span>의 뜻은 '${q.mean}'${josa(q.mean, "이야", "야")}. 문장을 다시 천천히 읽어 볼까?${CAN_SPEAK ? " 🔊 듣기를 눌러 봐도 좋아." : ""}`;
  popup("try", `괜찮아 ${NAME}야,<br>다시 생각해 볼까?`, hint, acts);
}

function showAnswer(q) {
  const res = state.days[cur].res;
  if (!(q.n in res)) res[q.n] = false;
  save();
  main.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (Number(b.dataset.k) === q.ans) b.classList.add("right"); });
  reveal(q);
  popup("good", `${NAME}야, 같이 정답을 봐요`,
    `<span class="en">${q.en}</span><br>= ${q.opts[q.ans]}<br>다음에 비슷한 문장이 나오면 ${NAME}는 분명 읽을 수 있을 거야!`, [nextAction()]);
}

function nextAction() {
  const last = state.days[cur].i === 9;
  return [last ? `Day ${cur + 1} 끝내기` : "다음 문제", () => { state.days[cur].i++; save(); renderQ(); window.scrollTo(0, 0); }];
}

// 파스텔 분홍 팝업. actions = [[글자, 누르면 할 일, "soft"?], ...]
function popup(kind, title, body, actions) {
  closePopup();
  const bg = document.createElement("div");
  bg.className = "pop-bg"; bg.id = "pop";
  bg.innerHTML = `<div class="pop ${kind}" role="alertdialog" aria-modal="true" aria-labelledby="pop-t" aria-describedby="pop-b">
    ${kind === "good" && cur !== null ? `<img class="pop-img" src="${MASCOT_SRC}" alt="비행기를 타고 있는 시나모롤" width="150" height="150">` : `<div class="pop-face" aria-hidden="true">💗</div>`}
    <strong id="pop-t">${title}</strong><p id="pop-b">${body}</p><div class="pop-btns"></div></div>`;
  const box = bg.querySelector(".pop-btns");
  actions.forEach(([label, fn, style]) => {
    const b = document.createElement("button");
    b.className = "btn " + (style || ""); b.textContent = label;
    b.addEventListener("click", () => { closePopup(); fn(); });
    box.appendChild(b);
  });
  document.body.appendChild(bg);
  box.querySelector("button").focus({preventScroll: true});
}
function closePopup() { const p = $("pop"); if (p) p.remove(); }

function finishDay() {
  const d = state.days[cur]; d.done = true; save(); logToday("eng", "Day " + (cur + 1));
  if (state.days.every(x => x.done) && !state.celebrated) { state.celebrated = true; save(); return renderCelebrate(); }
  const score = DAYS[cur].filter(n => d.res[n] === true).length;
  main.innerHTML = `<section class="card center">
    <div class="sec">Day ${cur + 1} 완료!</div>
    <div class="big">${score} / 10</div>
    <p class="q">${NAME}야, 오늘 10문장을 끝까지 다 읽었어! 처음에 바로 맞힌 문제가 ${score}개야. 정말 잘했어!</p>
    ${record([cur])}
    <div class="btns"><button class="btn" id="home">처음 화면으로</button></div></section>`;
  $("home").addEventListener("click", renderHome);
}

function record(dayIdx) {
  const rows = [];
  dayIdx.forEach(k => DAYS[k].forEach((n, pos) => {
    const r = state.days[k].res[n], q = QS[n - 1];
    if (r !== true) rows.push(`<tr><td>Day ${k + 1} · ${pos + 1}번</td><td class="en" lang="en">${q.en}</td><td>${THEME[q.t]}</td><td>${r === false ? "다시 생각하거나 함께 정답 봄" : "풀지 않음"}</td></tr>`);
  }));
  return `<details><summary>보호자·선생님용 기록</summary>
    <p class="note">처음 시도에서 맞히지 못한 문장입니다. 이 기록은 이 브라우저에만 남습니다.</p>
    <div class="tbl"><table><thead><tr><th>날짜·순서</th><th>문장</th><th>주제</th><th>상태</th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="4">모든 문제를 처음에 맞혔어요.</td></tr>`}</tbody></table></div></details>`;
}

function renderCelebrate() {
  closePopup();
  const total = state.days.reduce((s, d, k) => s + DAYS[k].filter(n => d.res[n] === true).length, 0);
  main.innerHTML = `<section class="card center celebrate">
    <div class="art">${TROPHY}${MASCOT("비행기를 타고 축하하는 시나모롤")}</div>
    <h2><span class="nw">축하해,</span> <span class="nw">${NAME}야!</span></h2>
    <p class="q">5일 동안 영어 문장 50개를 모두 읽었어! 이제 ${NAME}는 영어 읽기 박사야.</p>
    <div class="badges">${DAYS.map((_, k) => `<span>Day ${k + 1} ✓</span>`).join("")}</div>
    <p class="lead">처음에 바로 맞힌 문제: <b>${total} / 50</b></p>
    ${record([0, 1, 2, 3, 4])}
    <div class="btns"><button class="btn" id="home">처음 화면으로</button><button class="btn soft" id="reset">처음부터 다시 시작</button></div></section>`;
  $("home").addEventListener("click", renderHome);
  $("reset").addEventListener("click", () => { state = fresh(); save(); renderHome(); });
  confetti();
  window.scrollTo(0, 0);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--sun", "--pink", "--accent", "--good"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({length: 140}, () => ({x: Math.random() * W, y: -20 - Math.random() * H * .6, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], s: 6 + Math.random() * 6}));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - start < 4500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(start);
}

if (CAN_SPEAK) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
renderHome();
</script>
