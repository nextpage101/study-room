<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시계 읽기 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E8F5FD">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 첫 화면(환영 그림·시계·날짜·Day 카드) → 하루 10문제(한 화면에 한 문제) → 하루 완료 → 5일 모두 완료 시 축하 */
:root {
  --bg: #E8F5FD; --card: #FFFFFF; --ink: #1E3A52; --muted: #56738D; --line: #CBE5F5;
  --accent: #2A84C4; --accent-ink: #FFFFFF; --sun: #7CC8F2; --sun-soft: #DDF0FC;
  --hour: #E06A8A; --minute: #2A6FB8; --good: #2B8A6B; --good-soft: #E2F5EE;
  --try: #B86E0F; --try-soft: #FDF0DD; --face: #FFFFFF; --pink: #F5A9BF; --fur: #FFFFFF; --outline: #8DC4E8;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
/* 기기가 어두운 화면 모드여도 하늘색·흰색 한 가지로만 보이게 한다. */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; } h2 { font-size: 34px; color: var(--accent); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--display); color: var(--muted); font-variant-numeric: tabular-nums; font-size: 20px; }
.bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

/* 첫 화면 */
.hero { align-items: center; text-align: center; background: linear-gradient(180deg, var(--sun-soft), var(--card)); border-color: var(--sun); }
.art { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.art svg { height: auto; max-width: 100%; }
.art .kid { width: 190px; } .art .live { width: 150px; }
.mascot { width: 250px; height: auto; max-width: 100%; aspect-ratio: 1; object-fit: contain; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 4px solid var(--sun); padding: 6px; display: block; }
.mascot.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.date { font-family: var(--display); font-size: 22px; color: var(--ink); margin: 0; }
.date small { display: block; font-family: var(--body); font-size: 16px; color: var(--muted); }
.lead { margin: 0; font-size: 19px; }
/* Day 버튼: 한 줄에 3개, 다음 줄에 2개(가운데 정렬) */
.days { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.day {
  width: calc((100% - 20px) / 3);
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 6px; border-radius: 18px;
  background: var(--card); color: var(--ink); border: 3px solid var(--line); font-family: var(--display); cursor: pointer;
}
.day .dimg { width: 72%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; display: block; margin-bottom: 4px; }
.day .d { font-size: 24px; color: var(--accent); }
.day .s { font-size: 15px; color: var(--muted); font-family: var(--body); }
.day.done { border-color: var(--good); background: var(--good-soft); }
.day.done .d { color: var(--good); }
.day.next { border-color: var(--sun); }
.day:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.stamp { width: 34px; height: 34px; }
.nw { white-space: nowrap; }
html { -webkit-text-size-adjust: 100%; }
button, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* 모바일 */
/* 문제 */
.sec { font-family: var(--display); color: var(--accent); font-size: 16px; letter-spacing: .02em; }
.q { font-size: 25px; margin: 0; text-wrap: pretty; }
.qnum {
  display: inline-block; font-family: var(--display); font-size: 18px; line-height: 1;
  background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 12px 5px;
  margin-right: 10px; vertical-align: 3px;
}
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.choices li { background: var(--sun-soft); border-radius: 12px; padding: 4px 12px; font-size: 18px; }
.clockbox { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.clockbox svg { width: 200px; max-width: 100%; height: auto; }
.legend { display: flex; gap: 16px; font-size: 15px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
.legend b { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.answer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 22px; font-family: var(--display); }
.answer input {
  width: 3.2em; font: inherit; font-size: 26px; text-align: center; padding: 6px 4px;
  border: 3px solid var(--line); border-radius: 12px; background: var(--face); color: var(--ink); font-variant-numeric: tabular-nums;
}
.answer input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-color: var(--accent); }
.answer input.ok { border-color: var(--good); background: var(--good-soft); }
.answer input.again { border-color: var(--try); border-style: dashed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.card:not(.center) .btns { justify-content: flex-start; }
button.btn {
  font-family: var(--display); font-size: 20px; border: 0; border-radius: 14px; padding: 10px 22px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
button.btn.soft { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
button.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--muted); font-family: var(--display); font-size: 17px; cursor: pointer; padding: 4px 0; }
.msg { border-radius: 14px; padding: 12px 16px; font-size: 19px; }
.msg.good { background: var(--good-soft); border: 2px solid var(--good); }
.msg.try { background: var(--try-soft); border: 2px solid var(--try); }
.msg strong { font-family: var(--display); font-weight: 400; display: block; font-size: 22px; }
.msg.good strong { color: var(--good); } .msg.try strong { color: var(--try); }

/* 하루 완료·축하 */
.center { text-align: center; align-items: center; }
.big { font-family: var(--display); font-size: 56px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.celebrate { background: var(--sun-soft); border-color: var(--sun); }
.celebrate h2 { font-size: 38px; color: var(--accent); }
.celebrate .trophy { width: 180px; max-width: 100%; height: auto; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.badges span { font-family: var(--display); background: var(--card); border: 2px solid var(--good); color: var(--good); border-radius: 99px; padding: 2px 14px; }
details { width: 100%; text-align: left; border-top: 2px dashed var(--line); padding-top: 12px; }
summary { cursor: pointer; font-family: var(--display); color: var(--muted); }
.tbl { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; } th { color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: 15px; margin: 0; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
.kid .hand { transform-origin: 150px 150px; animation: wave 1.6s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(.6); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
.celebrate .trophy { animation: pop .6s ease-out; }

/* 피드백 팝업 (분홍) */
.pop-bg {
  position: fixed; inset: 0; z-index: 30; background: rgba(30, 58, 82, .2);
  display: flex; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.pop {
  width: 100%; max-width: 640px; background: #FFF1F5; border: 4px solid #F9CFDC; border-radius: 26px;
  padding: 18px 20px 20px; text-align: center; color: var(--ink);
  box-shadow: 0 8px 30px rgba(214, 140, 166, .3); animation: rise .28s ease-out;
  max-height: 100%; overflow-y: auto;
}
.pop-face { font-size: 40px; line-height: 1; }
.pop-img { width: 150px; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: #FFFFFF; border: 3px solid #F9CFDC; display: block; margin: 0 auto 4px; }
.pop strong { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; color: #B8577A; margin: 6px 0 4px; text-wrap: balance; }
.pop p { margin: 0 0 14px; font-size: 21px; line-height: 1.55; text-wrap: pretty; }
.pop-btns { display: flex; flex-direction: column; gap: 10px; }
.pop .btn { width: 100%; background: #F7C3D4; color: #6E2A44; min-height: 56px; font-size: 24px; }
.pop .btn.soft { background: #FFFFFF; color: #9E4A69; border: 3px solid #F7C3D4; }
@keyframes rise { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 휴대폰(세로 화면 또는 좁은 화면): 화면 폭에 비례해 크기를 정한다. 기본값을 덮어쓰도록 반드시 스타일 맨 끝에 둔다. */
/* 너무 빨리 누를 때 잠깐 뜨는 알림 */
.slow { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: #FFF1F5; border: 3px solid #F9CFDC; color: #9E4A69; font-family: var(--display); font-size: clamp(20px, 5.6vw, 40px); padding: 12px 22px; border-radius: 99px; box-shadow: 0 6px 20px rgba(214, 140, 166, .3); opacity: 0; pointer-events: none; white-space: nowrap; }
.slow.on { animation: slowNote 1.8s ease-out; }
@keyframes slowNote { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

@media (max-width: 560px), (orientation: portrait) {
  body { font-size: clamp(20px, 5.2vw, 42px); padding-block: 3vw 7vw; }
  .wrap { max-width: none; gap: 3.5vw; }
  .card { padding: 4.5vw; border-radius: 5vw; gap: 3.8vw; }
  .hero { gap: 3vw; }
  .art { flex-wrap: nowrap; gap: 3vw; }
  .art .live, .art .kid { width: 34vw; max-width: none; }
  .mascot { width: 54vw; max-width: none; }
  h2 { font-size: clamp(30px, 8.5vw, 68px); line-height: 1.3; }
  .date { font-size: clamp(20px, 5.8vw, 46px); }
  .lead { font-size: clamp(19px, 5.6vw, 44px); }
  .bar { height: clamp(10px, 2.6vw, 20px); }
  .days { gap: 2.6vw; }
  .day { width: calc((100% - 5.2vw) / 3); padding: 3.4vw 1.5vw; min-height: 20vw; border-radius: 4vw; justify-content: center; }
  .day .d { font-size: clamp(20px, 6.2vw, 48px); }
  .day .s { font-size: clamp(13px, 3.8vw, 30px); }
  .q { font-size: clamp(23px, 6.8vw, 54px); line-height: 1.5; }
  .qnum { font-size: clamp(18px, 5.4vw, 42px); padding: 1.4vw 3vw 1.2vw; margin-right: 2vw; vertical-align: .5vw; }
  .sec { font-size: clamp(16px, 4.8vw, 38px); }
  .choices li { font-size: clamp(20px, 6vw, 48px); padding: 1.4vw 3.6vw; border-radius: 3vw; }
  .clockbox svg { width: 60vw; max-width: none; }
  .legend { font-size: clamp(16px, 4.8vw, 38px); gap: 6vw; }
  .legend b { width: 7vw; height: 1.8vw; border-radius: 1vw; margin-right: 2vw; }
  .answer { font-size: clamp(23px, 6.8vw, 54px); gap: 2.6vw 1.6vw; }
  .answer input { width: 3em; font-size: clamp(28px, 8.4vw, 66px); min-height: 16vw; border-radius: 3.5vw; padding: 1vw; }
  .btns { flex-direction: column; gap: 2.6vw; }
  .btns button.btn { width: 100%; min-height: 15vw; font-size: clamp(22px, 6.4vw, 50px); border-radius: 4vw; }
  .link { font-size: clamp(18px, 5vw, 40px); }
  .top .count { font-size: clamp(18px, 5vw, 40px); }
  .msg { font-size: clamp(21px, 6.4vw, 50px); line-height: 1.5; padding: 4vw 4.6vw; border-radius: 4vw; border-width: 3px; }
  .msg strong { font-size: clamp(24px, 7.4vw, 58px); margin-bottom: 1vw; }
  .big { font-size: clamp(54px, 16vw, 120px); }
  .celebrate h2 { font-size: clamp(32px, 9.5vw, 74px); }
  .celebrate .art { flex-wrap: nowrap; }
  .celebrate .trophy { width: 42vw; max-width: none; }
  .badges span { font-size: clamp(16px, 4.8vw, 38px); padding: .6vw 3.6vw; }
  summary { font-size: clamp(17px, 5vw, 40px); }
  .note { font-size: clamp(14px, 4.2vw, 32px); }
  table { font-size: clamp(14px, 4.2vw, 32px); }
  .pop { border-radius: 6vw; padding: 4.5vw 5vw 5vw; }
  .pop-face { font-size: clamp(36px, 10vw, 80px); }
  .pop-img { width: 38vw; }
  .pop strong { font-size: clamp(25px, 7.6vw, 60px); }
  .pop p { font-size: clamp(20px, 6vw, 48px); margin-bottom: 4vw; }
  .pop .btn { min-height: 15vw; font-size: clamp(22px, 6.6vw, 52px); border-radius: 4vw; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .kid .hand, .celebrate .trophy, .mascot.bob, .pop { animation: none; } }
</style>
</head>
<body>

<div class="wrap" id="main"></div>
<canvas id="confetti" hidden></canvas>

<script>
const NAME = "지호";
const SEC = {
  1: ["몇 시 몇 분일까요? (5분씩)", "긴바늘을 5씩 잘 세었어!"],
  2: ["몇 시 몇 분일까요? (1분씩)", "작은 눈금까지 꼼꼼하게 세었구나!"],
  3: ["바늘은 어디에 있을까요?", "바늘이 어디에 있는지 정확하게 알고 있네!"],
  4: ["몇 시 몇 분 전", "몇 분 전인지 잘 생각했어!"],
  5: ["1시간은 몇 분일까요?", "시간과 분을 잘 바꾸었어!"],
  6: ["얼마나 걸렸을까요?", "걸린 시간을 차근차근 잘 구했어!"],
  7: ["오전과 오후, 하루", "오전과 오후, 하루를 잘 알고 있구나!"],
  8: ["달력", "달력을 잘 알고 있구나!"]
};
const T = (h, m) => [{a: h, s: "시"}, {a: m, s: "분"}];
const M = m => [{a: m, s: "분"}];
const HM = (h, m) => [{a: h, s: "시간"}, {a: m, s: "분"}];
const one = (a, s, p) => [{a, s, p}];
const between = (a, b, end) => `짧은바늘은 ${a}와 ${b} 사이에 있고, ${end}`;
const tick = (n, k) => `긴바늘은 숫자 ${n}에서 작은 눈금 ${k}칸을 더 간 곳에 있어요. 몇 시 몇 분일까요?`;

const QS = [
  [1, between(2,3,"긴바늘은 1을 가리켜요. 몇 시 몇 분일까요?"), T(2,5), "긴바늘이 1에 있으면, 5씩 세어 보면 몇 분일까?", [2,5]],
  [1, between(4,5,"긴바늘은 3을 가리켜요. 몇 시 몇 분일까요?"), T(4,15), "5, 10, 15… 긴바늘이 있는 3까지 같이 세어 볼까?", [4,15]],
  [1, "짧은바늘은 7과 8 사이에 있고, 긴바늘은 4를 가리켜요. 몇 시 몇 분일까요?", T(7,20), "짧은바늘이 7을 지났으니 7시야. 긴바늘 4는 5씩 몇 번일까?", [7,20]],
  [1, between(9,10,"긴바늘은 7을 가리켜요. 몇 시 몇 분일까요?"), T(9,35), "긴바늘이 7에 있어. 5씩 7번 세어 보자!", [9,35]],
  [1, "짧은바늘은 11과 12 사이에 있고, 긴바늘은 9를 가리켜요. 몇 시 몇 분일까요?", T(11,45), "짧은바늘이 아직 12에 안 갔으니 몇 시일까?", [11,45]],
  [1, "짧은바늘은 1과 2 사이에 있고, 긴바늘은 10을 가리켜요. 몇 시 몇 분일까요?", T(1,50), "긴바늘이 10에 있으면 5씩 10번이야. 천천히 세어 볼까?", [1,50]],
  [1, between(5,6,"긴바늘은 11을 가리켜요. 몇 시 몇 분일까요?"), T(5,55), "짧은바늘이 6에 거의 왔지만 아직 6을 안 지났어. 그럼 몇 시일까?", [5,55]],
  [1, "짧은바늘은 8과 9 사이에 있고, 긴바늘은 5를 가리켜요. 몇 시 몇 분일까요?", T(8,25), "긴바늘 5는 5씩 다섯 번! 같이 세어 보자.", [8,25]],
  [1, between(12,1,"긴바늘은 8을 가리켜요. 몇 시 몇 분일까요?"), T(12,40), "짧은바늘이 12를 지났으니 12시야. 긴바늘 8은 몇 분일까?", [12,40]],
  [1, "긴바늘이 숫자 6을 가리키면 몇 분일까요?", M(30), "6은 시계의 딱 절반이야. 5씩 6번 세어 볼까?"],
  [2, "짧은바늘은 3과 4 사이에 있고, " + tick(2,3), T(3,13), "2는 10분이야. 거기서 작은 눈금 3칸을 더 가면?", [3,13]],
  [2, "짧은바늘은 6과 7 사이에 있고, " + tick(5,2), T(6,27), "5는 25분! 작은 눈금 2칸을 더하면?", [6,27]],
  [2, "짧은바늘은 10과 11 사이에 있고, " + tick(8,4), T(10,44), "8은 40분이야. 작은 눈금을 하나씩 세어 볼까?", [10,44]],
  [2, "짧은바늘은 2와 3 사이에 있고, " + tick(11,1), T(2,56), "11은 55분이야. 한 칸 더 가면 몇 분일까?", [2,56]],
  [2, "짧은바늘은 7을 조금 지났고, " + tick(12,1), T(7,1), "긴바늘이 12에서 막 출발했어. 몇 칸 갔는지 볼까?", [7,1]],

function clockSVG(h, m, s, cls) {
  const c = 100;
  let o = `<svg class="${cls || ""}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시계 그림">`;
  o += `<circle cx="100" cy="100" r="94" fill="var(--face)" stroke="var(--accent)" stroke-width="5"/>`;
  for (let k = 0; k < 60; k++) {
    const a = k * 6 * Math.PI / 180, big = k % 5 === 0, r1 = big ? 78 : 83, r2 = 88;
    o += `<line x1="${c + r1 * Math.sin(a)}" y1="${c - r1 * Math.cos(a)}" x2="${c + r2 * Math.sin(a)}" y2="${c - r2 * Math.cos(a)}" stroke="var(--muted)" stroke-width="${big ? 2.5 : 1}"/>`;
  }
  for (let k = 1; k <= 12; k++) {
    const a = k * 30 * Math.PI / 180;
    o += `<text x="${c + 64 * Math.sin(a)}" y="${c - 64 * Math.cos(a)}" text-anchor="middle" dominant-baseline="central" font-family="Jua, sans-serif" font-size="18" fill="var(--ink)">${k}</text>`;
  }
  const ha = ((h % 12) + m / 60) * 30 * Math.PI / 180, ma = (m + (s || 0) / 60) * 6 * Math.PI / 180;
  o += `<line x1="100" y1="100" x2="${c + 44 * Math.sin(ha)}" y2="${c - 44 * Math.cos(ha)}" stroke="var(--hour)" stroke-width="8" stroke-linecap="round"/>`;
  o += `<line x1="100" y1="100" x2="${c + 72 * Math.sin(ma)}" y2="${c - 72 * Math.cos(ma)}" stroke="var(--minute)" stroke-width="4.5" stroke-linecap="round"/>`;
  if (s !== undefined) { const sa = s * 6 * Math.PI / 180; o += `<line x1="100" y1="100" x2="${c + 80 * Math.sin(sa)}" y2="${c - 80 * Math.cos(sa)}" stroke="var(--pink)" stroke-width="2" stroke-linecap="round"/>`; }
  o += `<circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>`;
  return o;
}

// 오늘 한 공부를 첫 화면(오늘의 공부)에 알려 주는 기록. 날짜가 바뀌면 새로 시작한다
function logToday(subj, label) {
  try {
    const k = "study-today-v1", n = new Date(), day = n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate();
    let s = JSON.parse(localStorage.getItem(k)) || {};
    if (s.date !== day || !s.done) s = {date: day, done: {}};
    const a = s.done[subj] || (s.done[subj] = []);
    if (!a.includes(label)) a.push(label);
    localStorage.setItem(k, JSON.stringify(s));
  } catch (e) {}
}function todayText() {
  const d = new Date(), w = "일월화수목금토"[d.getDay()];
  return `<span class="nw">${d.getFullYear()}년</span> <span class="nw">${d.getMonth() + 1}월 ${d.getDate()}일</span> <span class="nw">${w}요일</span>`;
}

/* ---------- 찍기 방지 ----------
   ② 문제가 나오고 WAIT_MS 안에 누르면 답을 받지 않고 "천천히" 알림을 띄운다(듣기 문제는 소리가 끝날 즈음부터 잰다).
   ① 처음에 틀린 문제는 Day 끝에 순서와 보기를 바꿔 다시 낸다. 다시 풀기에서 한 번에 맞혀야 끝난다.
   ⑤ 보호자 기록에 '빨리 누름'과 '다시 풀기' 횟수를 남긴다. */
const WAIT_MS = 2500;
let readyAt = 0;
const armWait = (extra = 0) => { readyAt = Date.now() + WAIT_MS + extra; };
function tooFast(bag, id, msg) {
  if (Date.now() >= readyAt) return false;
  bag.fast = bag.fast || {}; bag.fast[id] = (bag.fast[id] || 0) + 1; save();
  let t = document.getElementById("slow");
  if (!t) { t = document.createElement("div"); t.id = "slow"; t.className = "slow"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg || "🐢 천천히 읽고 골라 볼까?";
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  return true;
}
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reshuffle = q => { const o = shuf(q.opts.map((_, i) => i)); return {...q, opts: o.map(i => q.opts[i]), ans: o.indexOf(q.ans)}; };
const retryList = (bag, base) => [...base, ...(bag.extra || [])];
const missOf = (bag, base) => base.filter(id => bag.res[id] !== true && !(bag.clear || {})[id]);
const missLeft = (bag, base) => missOf(bag, base).length > 0;
function addRetry(bag, base) {
  const miss = missOf(bag, base);
  if (!miss.length) return 0;
  bag.extra = [...(bag.extra || []), ...shuf(miss)]; save();
  return miss.length;
}
function clearIfFirst(bag, base, id) { if (bag.i >= base.length && tries === 1) { (bag.clear = bag.clear || {})[id] = true; save(); } }
const timesRetried = (bag, id) => (bag.extra || []).filter(x => x === id).length;
const countText = (bag, base, label) => bag.i >= base.length
  ? `${label} · 다시 풀기 ${bag.i - base.length + 1} / ${bag.extra.length}`
  : `${label} · ${bag.i + 1} / ${base.length}`;
function retryIntro(n) {
  popup("try", `${NAME}야, 처음에 틀린 문제를<br>한 번 더 풀어 볼까?`, `${n}문제가 다시 나와. 이번엔 천천히 읽고 한 번에 맞혀 보자! 한 번에 맞혀야 끝나.`, [["좋아, 해 볼게!", () => armWait()]]);
}

function renderHome() {
  stopClock(); cur = null;
  const firstOpen = state.days.findIndex(d => !d.done);
  const allDone = firstOpen === -1;
  let cards = state.days.map((d, k) => {
    const score = DAYS[k].filter(n => d.res[n] === true).length;
    const sub = d.done ? `다 했어! ${score}/10` : d.i > 0 ? `${Math.min(d.i, 10)}/10 하는 중` : "10문제";
    return `<button class="day ${d.done ? "done" : ""} ${k === firstOpen ? "next" : ""}" data-day="${k}" aria-label="Day ${k + 1}, ${sub}"><span class="d">Day ${k + 1}</span><span class="s">${sub}</span></button>`;
  }).join("");
  main.innerHTML = `
    <a class="link" href="index.html">← 과목 고르기</a>
    <section class="card hero">
      <div class="art">${KID}<div id="live">${liveClock()}</div></div>
      <h2><span class="nw">오늘은</span> <span class="nw">수학 시간</span></h2>
      <p class="lead">우리 시계 공부 같이 해보자~</p>
    </section>
    <section class="days" aria-label="날짜별 문제">${cards}</section>
    ${allDone ? `<div class="btns"><button class="btn soft" id="party">축하 다시 보기</button></div>` : ""}`;
  main.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => startDay(Number(b.dataset.day))));
  if (allDone) $("party").addEventListener("click", renderCelebrate);
  clockTimer = setInterval(() => { const el = $("live"); if (el) el.innerHTML = liveClock(); }, 1000);
}

function liveClock() { const d = new Date(); return clockSVG(d.getHours(), d.getMinutes(), d.getSeconds(), "live"); }

function startDay(k) {
  stopClock(); cur = k;
  if (state.days[k].done) state.days[k] = {i: 0, res: {}, done: false};
  save(); renderQ(); window.scrollTo(0, 0);
}

function renderQ() {
  const d = state.days[cur];
  const base = DAYS[cur];
  let added = 0;
  if (d.i >= retryList(d, base).length && !(added = addRetry(d, base))) return finishDay();
  const re = d.i >= base.length;
  const q = QS[retryList(d, base)[d.i] - 1]; tries = 0; armWait();
  let html = `<div class="top"><button class="link" id="home">← 처음 화면</button><span class="count">${countText(d, base, "Day " + (cur + 1))}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.min(100, d.i * 10)}%"></i></div>
    <section class="card"><div class="sec">${re ? "🔁 다시 풀기 · " : ""}${SEC[q.sec][0]}</div>
    <p class="q"><span class="qnum">${re ? "다시" : d.i + 1 + "번"}</span>${q.q}</p>`;
  if (q.choices) html += `<ul class="choices">${q.choices.map(c => `<li>${c}</li>`).join("")}</ul>`;
  if (q.clock) html += `<div class="clockbox">${clockSVG(q.clock[0], q.clock[1])}<div class="legend"><span><b style="background:var(--hour)"></b>짧은바늘</span><span><b style="background:var(--minute)"></b>긴바늘</span></div></div>`;
  html += `<form id="f" class="answer" autocomplete="off">`;
  q.f.forEach((fd, k) => {
    html += `${fd.p ? `<span>${fd.p}</span>` : ""}<input id="a${q.n}-${k}" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="답 ${k + 1}">${fd.s ? `<span>${fd.s}</span>` : ""}`;
  });
  html += `</form><div id="msg" aria-live="polite"></div><div class="btns" id="btns"><button class="btn" type="submit" form="f">정답 확인</button></div></section>`;
  main.innerHTML = html;
  $("home").addEventListener("click", renderHome);
  const ins = [...main.querySelectorAll(".answer input")];
  ins.forEach(el => el.addEventListener("input", () => { el.value = el.value.replace(/[^0-9]/g, ""); el.classList.remove("again", "ok"); }));
  // 휴대폰에서는 키패드가 문제와 시계를 가리지 않도록 자동으로 입력칸을 누르지 않는다.
  if (window.matchMedia("(pointer: fine)").matches) ins[0].focus();
  ins.forEach(el => el.addEventListener("focus", () => setTimeout(() => el.scrollIntoView({block: "center", behavior: "smooth"}), 250)));
  $("f").addEventListener("submit", e => { e.preventDefault(); check(q, ins); });
  if (added) retryIntro(added);
}

function check(q, ins) {
  const res = state.days[cur].res;
  const vals = ins.map(el => el.value === "" ? null : Number(el.value));
  if (vals.some(v => v === null)) {
    const empty = ins.find(el => el.value === "");
    popup("try", "빈칸이 있어요", `${NAME}야, 모든 칸에 숫자를 써 볼까?`, [["알겠어!", () => empty.focus()]]);
    return;
  }
  if (tooFast(state.days[cur], q.n, "🐢 천천히 생각하고 써 볼까?")) return;
  const ok = q.f.map((fd, k) => vals[k] === fd.a);
  if (q.anyOrder) { const [x, y] = q.anyOrder; if (vals[x] === q.f[y].a && vals[y] === q.f[x].a) ok[x] = ok[y] = true; }
  tries++;
  ins.forEach((el, k) => { el.classList.toggle("ok", ok[k]); el.classList.toggle("again", !ok[k]); });
  if (ok.every(Boolean)) {
    if (!(q.n in res)) res[q.n] = tries === 1;
    save(); clearIfFirst(state.days[cur], DAYS[cur], q.n);
    const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    const extra = tries > 1 ? " 포기하지 않고 다시 생각해서 찾아냈네!" : "";
    ins.forEach(el => { el.readOnly = true; });
    $("btns").innerHTML = "";
    popup("good", cheer, SEC[q.sec][1] + extra, [nextAction()]);
    return;
  }
  let part = "", hint = q.hint;
  if (ok.some(Boolean)) {
    const right = names(q, ok.map((v, k) => v ? k : -1).filter(k => k >= 0));
    const wrong = names(q, ok.map((v, k) => v ? -1 : k).filter(k => k >= 0));
    part = `${right}${josa(right, "은", "는")} 맞았어! ${wrong}${josa(wrong, "을", "를")} 다시 생각해 볼까? `;
    // '몇 시'만 틀렸고 시계 문제라면, 분에 대한 힌트 대신 짧은바늘 힌트를 준다
    if (wrong === "'몇 시'" && q.clock) hint = "짧은바늘이 어느 숫자를 지났는지 볼까? 짧은바늘은 '몇 시'를 알려 줘.";
  }
  const first = ins.find((el, k) => !ok[k]);
  const acts = [["다시 해 볼게!", () => { first.focus(); first.select(); }]];
  if (tries >= 2) acts.push(["같이 정답 보기", () => showAnswer(q, ins), "soft"]);
  popup("try", `괜찮아 ${NAME}야,<br>다시 생각해 볼까?`, part + hint, acts);
}

// 입력칸 이름: '몇 시', '몇 분'처럼 아이가 알아듣는 말로 부른다
function fieldName(q, k) {
  const f = q.f[k], p = f.p || "", s = f.s || "";
  if (q.anyOrder && q.anyOrder.includes(k)) return k === q.anyOrder[0] ? "짧은바늘 앞 숫자" : "짧은바늘 뒤 숫자";
  if (p.includes("짧은바늘")) return "짧은바늘";
  if (p.includes("긴바늘")) return "긴바늘";
  if (s.startsWith("번")) return "번호";
  if (s.startsWith("시간")) return "'몇 시간'";
  if (s.startsWith("시")) return "'몇 시'";
  if (s.startsWith("분")) return "'몇 분'";
  if (s.startsWith("칸")) return "칸 수";
  if (p === "숫자") return "숫자";
  return `${k + 1}번째 칸`;
}
function names(q, ks) { return ks.map(k => fieldName(q, k)).join(", "); }
function josa(word, withFinal, noFinal) {
  const ch = word.replace(/[^가-힣]/g, "").slice(-1);
  if (!ch) return noFinal;
  return (ch.charCodeAt(0) - 0xAC00) % 28 ? withFinal : noFinal;
}

function showAnswer(q, ins) {
  const res = state.days[cur].res;
  if (!(q.n in res)) res[q.n] = false;
  save();
  ins.forEach((el, k) => { el.value = q.f[k].a; el.classList.remove("again"); el.classList.add("ok"); el.readOnly = true; });
  $("btns").innerHTML = "";
  popup("good", `${NAME}야, 같이 정답을 봐요`, `입력칸에 정답을 넣어 두었어. 천천히 읽어 보자. 다음에 비슷한 문제가 나오면 ${NAME}는 분명 풀 수 있을 거야!`, [nextAction()]);
}

function nextAction() {
  const d = state.days[cur], last = d.i === retryList(d, DAYS[cur]).length - 1 && !missLeft(d, DAYS[cur]);
  return [last ? `Day ${cur + 1} 끝내기` : "다음 문제", () => { state.days[cur].i++; save(); renderQ(); window.scrollTo(0, 0); }];
}

// 분홍색 팝업: 화면 아래에서 올라온다. actions = [[글자, 누르면 할 일, "soft"?], ...]
function popup(kind, title, body, actions) {
  closePopup();
  const bg = document.createElement("div");
  bg.className = "pop-bg"; bg.id = "pop";
  bg.innerHTML = `<div class="pop ${kind}" role="alertdialog" aria-modal="true" aria-labelledby="pop-t" aria-describedby="pop-b">
    ${kind === "good" && cur !== null ? `<img class="pop-img" src="${MASCOT_SRC}" alt="풍선을 들고 있는 시나모롤" width="150" height="150">` : `<div class="pop-face" aria-hidden="true">💗</div>`}
    <strong id="pop-t">${title}</strong><p id="pop-b">${body}</p><div class="pop-btns"></div></div>`;
  const box = bg.querySelector(".pop-btns");
  actions.forEach(([label, fn, style]) => {
    const b = document.createElement("button");
    b.className = "btn " + (style || ""); b.textContent = label;
    b.addEventListener("click", () => { closePopup(); fn(); });
    box.appendChild(b);
  });
  document.body.appendChild(bg);
  box.querySelector("button").focus({preventScroll: true});
}
function closePopup() { const p = $("pop"); if (p) p.remove(); }

function finishDay() {
  const d = state.days[cur]; d.done = true; save(); logToday("clock", "Day " + (cur + 1));
  if (state.days.every(x => x.done) && !state.celebrated) { state.celebrated = true; save(); return renderCelebrate(); }
  const score = DAYS[cur].filter(n => d.res[n] === true).length;
  main.innerHTML = `<section class="card center">
    <div class="sec">Day ${cur + 1} 완료!</div>
    <div class="big">${score} / 10</div>
    <p class="q">${NAME}야, 오늘 10문제를 끝까지 다 풀었어! 처음에 바로 맞힌 문제가 ${score}개야. 정말 잘했어!${d.extra && d.extra.length ? " 틀린 문제도 다시 풀어서 모두 맞혔어!" : ""}</p>
    ${record([cur])}
    <div class="btns"><button class="btn" id="home">처음 화면으로</button></div></section>`;
  $("home").addEventListener("click", renderHome);
}

function record(dayIdx) {
  const rows = [];
  dayIdx.forEach(k => DAYS[k].forEach((n, pos) => {
    const r = state.days[k].res[n], fz = (state.days[k].fast || {})[n] || 0, rt = timesRetried(state.days[k], n);
    if (r !== true || fz) rows.push(`<tr><td>Day ${k + 1} · ${pos + 1}번</td><td>원래 ${n}번</td><td>${SEC[QS[n - 1].sec][0]}</td><td>${r === true ? "처음에 맞힘" : r === false ? "다시 생각하거나 함께 정답 봄" : "풀지 않음"}</td><td>${fz ? fz + "번" : ""}</td><td>${rt ? rt + "번" : ""}</td></tr>`);
  }));
  return `<details><summary>보호자·선생님용 기록</summary>
    <p class="note">처음 시도에서 맞히지 못한 문제와 너무 빨리 누른 문제입니다. '빨리 누름'은 문제가 나오고 2.5초 안에 누른 횟수, '다시 풀기'는 끝에 다시 나온 횟수예요. 이 기록은 이 브라우저에만 남습니다.</p>
    <div class="tbl"><table><thead><tr><th>날짜·순서</th><th>문제</th><th>묶음</th><th>상태</th><th>빨리 누름</th><th>다시 풀기</th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="6">모든 문제를 처음에 맞혔어요.</td></tr>`}</tbody></table></div></details>`;
}

function renderCelebrate() {
  stopClock();
  const total = state.days.reduce((s, d, k) => s + DAYS[k].filter(n => d.res[n] === true).length, 0);
  main.innerHTML = `<section class="card center celebrate">
    <div class="art">${TROPHY}${MASCOT("풍선을 들고 축하하는 시나모롤")}</div>
    <h2><span class="nw">축하해,</span> <span class="nw">${NAME}야!</span></h2>
    <p class="q">5일 동안 시계 문제 50개를 모두 풀었어! 이제 ${NAME}는 시계 읽기 박사야.</p>
    <div class="badges">${DAYS.map((_, k) => `<span>Day ${k + 1} ✓</span>`).join("")}</div>
    <p class="lead">처음에 바로 맞힌 문제: <b>${total} / 50</b></p>
    ${record([0, 1, 2, 3, 4])}
    <div class="btns"><button class="btn" id="home">처음 화면으로</button><button class="btn soft" id="reset">처음부터 다시 시작</button></div></section>`;
  $("home").addEventListener("click", renderHome);
  $("reset").addEventListener("click", () => { state = fresh(); save(); renderHome(); });
  confetti();
  window.scrollTo(0, 0);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--sun", "--pink", "--accent", "--minute", "--hour"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({length: 140}, () => ({x: Math.random() * W, y: -20 - Math.random() * H * .6, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * 6, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], s: 6 + Math.random() * 6}));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - start < 4500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(start);
}

renderHome();
</script>

</body>
