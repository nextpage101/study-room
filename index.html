<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F5">
<title>지호의 공부방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 핑크 아기 공룡 인사 카드 → 과목 카드 2개(수학 · 영어). 파스텔 핑크 바탕 + 민트·라벤더·하늘 포인트 */
:root {
  --bg: #FFF0F5; --blush: #FFDDE8; --card: #FFFFFF; --ink: #4A3448; --muted: #8A6E82; --line: #F6D3DF;
  --pink: #E7799D; --pink-soft: #FFE6EE; --pink-line: #F4B4C9;
  --mint: #8FD6C4; --lav: #C7B6F2; --lav-soft: #F1ECFD; --sky: #6FB4E6; --sky-soft: #E6F3FC; --butter: #FFE08A;
  --good: #2B8A6B;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: 20px; line-height: 1.6;
  background-color: var(--bg);
  /* 작은 물방울 무늬 */
  background-image: radial-gradient(circle, #FFE3EC 2.5px, transparent 3px), radial-gradient(circle, #F3EDFF 2.5px, transparent 3px);
  background-size: 34px 34px, 34px 34px; background-position: 0 0, 17px 17px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
a { -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.nw { white-space: nowrap; }
.hero {
  background: linear-gradient(180deg, var(--blush) 0%, var(--card) 72%); border: 3px solid var(--pink-line); border-radius: 28px;
  padding: 22px 20px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.dino { width: 260px; max-width: 100%; height: auto; }
.dino .bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.dino .twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dino .twinkle.t2 { animation-delay: .6s; } .dino .twinkle.t3 { animation-delay: 1.2s; }
@keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
h1 { font-family: var(--display); font-weight: 400; font-size: 36px; color: var(--pink); margin: 0; line-height: 1.3; text-wrap: balance; }
.date { font-family: var(--display); font-size: 22px; margin: 0; }
.lead { margin: 0; font-size: 20px; color: var(--muted); }
.subjects { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.subject {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; text-decoration: none; color: var(--ink);
  background: var(--card); border: 4px solid var(--line); border-radius: 26px; padding: 20px 12px 18px;
  transition: transform .15s;
}
.subject:active { transform: scale(.97); }
.subject:focus-visible { outline: 4px solid var(--lav); outline-offset: 3px; }
.subject.math { border-color: #A9D4F2; background: linear-gradient(180deg, var(--sky-soft), var(--card) 60%); }
.subject.eng { border-color: var(--pink-line); background: linear-gradient(180deg, var(--pink-soft), var(--card) 60%); }
.subject svg { width: 116px; height: auto; max-width: 100%; }
.tag { font-family: var(--display); font-size: 18px; border-radius: 99px; padding: 2px 14px; }
.math .tag { background: var(--sky-soft); color: #2F7DB8; }
.eng .tag { background: var(--pink-soft); color: #C2537A; }
.name { font-family: var(--display); font-size: 30px; line-height: 1.2; }
.progress { font-size: 17px; color: var(--muted); }
.progress b { color: var(--good); font-weight: 400; font-family: var(--display); }
.go { font-family: var(--display); font-size: 22px; color: #FFFFFF; border-radius: 99px; padding: 6px 24px; margin-top: 4px; }
.math .go { background: var(--sky); }
.eng .go { background: var(--pink); }
.note { text-align: center; color: var(--muted); font-size: 15px; margin: 0; font-family: var(--display); }
/* 과목 제목: 수학(하늘) · 영어(분홍) */
.group { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 6px 0 -4px; display: flex; align-items: center; gap: 10px; }
.group::after { content: ""; flex: 1; height: 3px; border-radius: 3px; }
.math-h { color: #2F7DB8; } .math-h::after { background: #A9D4F2; }
.eng-h { color: #C2537A; } .eng-h::after { background: var(--pink-line); }
.subject.wide { grid-column: 1 / -1; }
.kor-h { color: #6A55B8; } .kor-h::after { background: #D9CEF7; }
.subject.kor { border-color: #D9CEF7; background: linear-gradient(180deg, var(--lav-soft), var(--card) 60%); }
.kor .go { background: #A895DE; }
.name, .go { white-space: nowrap; }

/* 휴대폰 세로 화면: 화면 폭에 비례 */
/* 오늘의 공부: 오늘 한 과목과 안 한 과목 */
.today { background: var(--card); border: 3px solid var(--pink-line); border-radius: 24px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.today-h { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--pink); }
.today-n { font-size: 18px; color: var(--muted); white-space: nowrap; }
.today-n b { color: var(--good); font-weight: 400; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--ink); border: 3px solid var(--line); border-radius: 16px; padding: 8px 4px; background: #FFFFFF; text-align: center; }
.chip .c-name { font-family: var(--display); font-size: 19px; line-height: 1.2; white-space: nowrap; }
.sticker { width: 40px; height: 40px; border-radius: 50%; border: 3px dashed var(--line); display: flex; align-items: center; justify-content: center; margin-top: 4px; }
.sticker.on { border: 0; transform: rotate(-10deg); animation: stick .5s ease-out; }
.sticker .heart { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px rgba(196, 83, 122, .35)); }
@keyframes stick { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(-6deg); } 100% { transform: scale(1) rotate(-10deg); } }
.chip.done { border-color: var(--pink-line); background: var(--pink-soft); }
.chip:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }
.today.all { border-color: #FFD36E; box-shadow: 0 0 0 4px #FFF3C4; }
.today.all .today-h { cursor: pointer; }
.party { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.party svg { position: absolute; filter: drop-shadow(0 2px 3px rgba(196, 83, 122, .3)); }
.cheer { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 2; width: max-content; max-width: 92vw; text-align: center; font-family: var(--display); line-height: 1.15; }
.cheer b { display: block; font-weight: 400; font-size: 60px; color: #E7799D; -webkit-text-stroke: 2px #FFFFFF; paint-order: stroke fill; text-shadow: 0 4px 0 #FFFFFF, 0 6px 16px rgba(196, 83, 122, .45); white-space: nowrap; }
.cheer span { display: inline-block; margin-top: 10px; font-size: 26px; color: #8A5BC9; background: rgba(255, 255, 255, .92); border: 3px solid #E9DDFB; border-radius: 99px; padding: 6px 20px; }

@media (max-width: 560px), (orientation: portrait) {
  .cheer b { font-size: clamp(38px, 12vw, 96px); }
  .cheer span { font-size: clamp(20px, 5.6vw, 44px); padding: 1.5vw 5vw; }
  body { font-size: clamp(20px, 5.2vw, 42px); padding-top: calc(3vw + env(safe-area-inset-top, 0px)); background-size: 8vw 8vw, 8vw 8vw; background-position: 0 0, 4vw 4vw; }
  .wrap { max-width: none; gap: 4vw; }
  .hero { border-radius: 7vw; padding: 5vw 4.5vw; gap: 2.5vw; }
  .dino { width: 68vw; }
  h1 { font-size: clamp(30px, 9vw, 72px); }
  .date { font-size: clamp(20px, 5.8vw, 46px); }
  .lead { font-size: clamp(19px, 5.6vw, 44px); }
  .subjects { gap: 3.5vw; }
  .subject { border-radius: 7vw; padding: 5vw 3vw 4.5vw; gap: 2vw; border-width: 3px; }
  .subject svg { width: 30vw; }
  .tag { font-size: clamp(15px, 4.4vw, 34px); padding: .4vw 3.4vw; }
  .name { font-size: clamp(24px, 7.4vw, 58px); }
  .progress { font-size: clamp(14px, 4.2vw, 32px); }
  .go { font-size: clamp(18px, 5.6vw, 44px); padding: 1.4vw 6vw; }
  .note { font-size: clamp(14px, 4.2vw, 32px); }
  .group { font-size: clamp(22px, 7vw, 56px); gap: 3vw; margin: 1.5vw 0 -1vw; }
  .subject.wide svg { width: 30vw; }
  .today { border-radius: 6vw; padding: 4vw 3.5vw 3.5vw; gap: 2.5vw; }
  .today-h { font-size: clamp(22px, 6.6vw, 52px); }
  .today-n { font-size: clamp(15px, 4.6vw, 36px); }
  .chips { gap: 2vw; }
  .chip { border-radius: 4vw; padding: 2.4vw 1vw; }
  .chip .c-name { font-size: clamp(15px, 4.6vw, 36px); }
  .sticker { width: 10.5vw; height: 10.5vw; margin-top: 1vw; }
}
@media (prefers-reduced-motion: reduce) { .sticker.on { animation: none; } .subject { transition: none; } .dino .bob, .dino .twinkle { animation: none; } }
</style>

        <path d="M14 30 q23 -10 46 4 v66 q-23 -14 -46 -4z" fill="#FFE6EE" stroke="#E7799D" stroke-width="4" stroke-linejoin="round"/>
        <path d="M106 30 q-23 -10 -46 4 v66 q23 -14 46 -4z" fill="#FFFFFF" stroke="#E7799D" stroke-width="4" stroke-linejoin="round"/>
        <text x="36" y="66" text-anchor="middle" font-family="Jua, sans-serif" font-size="20" fill="#C2537A">AB</text>
        <text x="84" y="66" text-anchor="middle" font-family="Jua, sans-serif" font-size="20" fill="#2F7DB8">C</text>
        <path d="M92 14 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#C7B6F2"/>
      </svg>
      <span class="name">읽기/듣기</span>
      <span class="progress" id="p-eng">5일 · 50문제</span>
      <span class="go">시작하기</span>
    </a>
    <a class="subject eng" href="Word_quiz_202611.html">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="14" y="22" width="68" height="50" rx="12" fill="#FFFFFF" stroke="#E7799D" stroke-width="4" transform="rotate(-8 48 47)"/>
        <text x="48" y="50" text-anchor="middle" dominant-baseline="central" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="22" fill="#C2537A" transform="rotate(-8 48 47)">cat</text>
        <rect x="40" y="52" width="68" height="50" rx="12" fill="#FFE6EE" stroke="#E7799D" stroke-width="4" transform="rotate(6 74 77)"/>
        <text x="74" y="78" text-anchor="middle" dominant-baseline="central" font-family="Jua, sans-serif" font-size="22" fill="#2F7DB8" transform="rotate(6 74 77)">고양이</text>
        <path d="M100 12 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#C7B6F2"/>
      </svg>
      <span class="name">단어</span>

</div>

<script>
(function () {
  const d = new Date(), w = "일월화수목금토"[d.getDay()];
  document.getElementById("today").innerHTML =
    `오늘은 <span class="nw">${d.getFullYear()}년</span> <span class="nw">${d.getMonth() + 1}월 ${d.getDate()}일</span> <span class="nw">${w}요일</span>`;

  // 같은 주소(GitHub Pages)에 올리면 각 퀴즈의 진행 기록을 읽어 보여 준다
  function show(key, id, n = 5) {
    try {
      const s = JSON.parse(localStorage.getItem(key));
      if (!s || !s.days) return;
      const done = s.days.filter(x => x.done).length;
      const el = document.getElementById(id);
      if (done === n) el.innerHTML = `<b>${n}일 모두 끝!</b> 🎉`;
      else if (done > 0) el.innerHTML = `<b>Day ${done}</b>까지 했어요`;
    } catch (e) {}
  }
  // 오늘의 공부: 퀴즈가 Day(급수)를 끝낼 때 남기는 study-today-v1 기록을 읽는다
  (function () {
    const SUBJ = [
      ["kor", "맞춤법", "Hangul_quiz_202611.html"],
      ["dict", "받아쓰기", "Dictation_quiz_202611.html"],
      ["hanja", "한자", "Hanja_quiz_202611.html"],
      ["clock", "시계 보기", "Math_quiz_202611.html"],
      ["gugu", "구구단", "Gugudan_quiz_202611.html"],
      ["eng", "읽기/듣기", "ENG_quiz_202611.html"],
      ["word", "단어", "Word_quiz_202611.html"]
    ];
    const HEART = '<svg class="heart" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35 C8 26 3 19 3 12.5 C3 7.5 7 4 11.5 4 C15 4 18 6 20 9 C22 6 25 4 28.5 4 C33 4 37 7.5 37 12.5 C37 19 32 26 20 35z" fill="#F48BAE" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="3.5" ry="2.4" fill="#FFFFFF" opacity=".7" transform="rotate(-30 12 12)"/></svg>';
    let done = {};
    try {
      const s = JSON.parse(localStorage.getItem("study-today-v1")), n = new Date();
      if (s && s.done && s.date === n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate()) done = s.done;
    } catch (e) {}
    const cnt = SUBJ.filter(([k]) => done[k] && done[k].length).length;
    document.getElementById("chips").innerHTML = SUBJ.map(([k, name, href]) => {
      const d = done[k] && done[k].length ? done[k] : null;
      return `<a class="chip${d ? " done" : ""}" href="${href}"><span class="c-name">${name}</span><span class="sticker${d ? " on" : ""}" role="img" aria-label="${d ? "끝냈어요" : "아직"}">${d ? HEART : ""}</span></a>`;
    }).join("");
    document.getElementById("todayN").innerHTML = `<b>${cnt}</b> / ${SUBJ.length}`;
    // 6과목을 다 끝낸 날: 하트·별 폭죽 (그날 처음 볼 때 한 번, '오늘의 공부' 제목을 누르면 다시)
    if (cnt === SUBJ.length) {
      const box = document.querySelector(".today");
      box.classList.add("all");
      const party = () => {
        const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        const layer = document.createElement("div"); layer.className = "party"; document.body.appendChild(layer);
        const COLORS = ["#F48BAE", "#FFB3C9", "#C7B6F2", "#FFE08A", "#8FD6C4", "#9FD0F5"];
        const HEART_P = "M20 35 C8 26 3 19 3 12.5 C3 7.5 7 4 11.5 4 C15 4 18 6 20 9 C22 6 25 4 28.5 4 C33 4 37 7.5 37 12.5 C37 19 32 26 20 35z";
        const STAR_P = "M20 2 L25 14 L38 15 L28 24 L31 37 L20 30 L9 37 L12 24 L2 15 L15 14z";
        // 칭찬 멘트 (폭죽과 함께 화면 가운데)
        const NAME = "지호";
        const CHEERS = [[`${NAME} 최고!`, "오늘 공부를 다 끝냈어!"], [`와, ${NAME} 대단해!`, `${SUBJ.length}과목을 다 했어!`], [`${NAME}야, 멋져!`, "오늘도 정말 잘했어!"], [`${NAME} 짱!`, "끝까지 해냈구나!"]];
        const [c1, c2] = CHEERS[Math.floor(Math.random() * CHEERS.length)];
        const cheer = document.createElement("div"); cheer.className = "cheer"; cheer.setAttribute("role", "status");
        cheer.innerHTML = `<b>${c1}</b><span>${c2}</span>`;
        layer.appendChild(cheer);
        cheer.animate(reduce ? [{opacity: 0}, {opacity: 1, offset: 0.1}, {opacity: 1, offset: 0.85}, {opacity: 0}] : [
          {transform: "translate(-50%, -50%) scale(0.3)", opacity: 0},
          {transform: "translate(-50%, -50%) scale(1.15)", opacity: 1, offset: 0.12},
          {transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.2},
          {transform: "translate(-50%, -50%) scale(1.04)", opacity: 1, offset: 0.55},
          {transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.85},
          {transform: "translate(-50%, -60%) scale(0.95)", opacity: 0}
        ], {duration: 3800, easing: "ease-out", fill: "both"});        const W = innerWidth, H = innerHeight, bursts = reduce ? 1 : 4, per = reduce ? 14 : 26;
        for (let b = 0; b < bursts; b++) {
          const ox = W * (0.2 + 0.6 * ((b * 0.37 + 0.5) % 1)), oy = H * (0.25 + 0.2 * (b % 2));
          for (let i = 0; i < per; i++) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            const size = 20 + Math.random() * 26, color = COLORS[(i + b) % COLORS.length];
            el.setAttribute("viewBox", "0 0 40 40"); el.setAttribute("width", size); el.setAttribute("height", size);
            el.innerHTML = `<path d="${i % 2 ? STAR_P : HEART_P}" fill="${color}" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>`;
            el.style.left = ox + "px"; el.style.top = oy + "px";
            layer.appendChild(el);
            const ang = Math.random() * Math.PI * 2, dist = (reduce ? 60 : 110) + Math.random() * Math.min(W, H) * 0.35;
            const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = (Math.random() - 0.5) * 540;
            el.animate([
              {transform: "translate(-50%, -50%) scale(0) rotate(0deg)", opacity: 1},
              {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.45},
              {transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 160}px)) scale(0.8) rotate(${rot}deg)`, opacity: 0}
            ], {duration: 1700 + Math.random() * 900, delay: b * 380, easing: "cubic-bezier(.15,.75,.35,1)", fill: "both"});
          }
        }
        setTimeout(() => layer.remove(), Math.max(bursts * 380 + 2800, 4000));
      };
      document.querySelector(".today-h").addEventListener("click", party);
      try {
        const s = JSON.parse(localStorage.getItem("study-today-v1"));
        if (!s.party) { s.party = true; localStorage.setItem("study-today-v1", JSON.stringify(s)); setTimeout(party, 400); }
      } catch (e) { setTimeout(party, 400); }
    }
  })();  show("clock-quiz-days-v1", "p-clock", 3);
  show("gugudan-quiz-days-v1", "p-gugu");
  show("hangul-quiz-days-v1", "p-kor");
  // 한자는 Day 대신 4A·5A 두 칸
  try {
    const h = JSON.parse(localStorage.getItem("hanja-quiz-4a5a-v2"));
    if (h && h.days) {
      const fin = ["4A", "5A"].filter((s, k) => h.days[k] && h.days[k].done);
      if (fin.length === 2) document.getElementById("p-hanja").innerHTML = "<b>4A·5A 모두 끝!</b> 🎉";
      else if (fin.length) document.getElementById("p-hanja").innerHTML = `<b>${fin[0]}</b> 끝냈어요`;
    }
  } catch (e) {}
  show("english-quiz-days-v1", "p-eng");
  // 받아쓰기: 9~14급, 급수마다 빈칸 채우기 + 받아쓰기
  try {
    const s = JSON.parse(localStorage.getItem("dictation-quiz-9-14-v1"));
    if (s && s.lv) {
      const el = document.getElementById("p-dict"), done = s.lv.filter(x => x.mc.done && x.dict.done).length;
      if (done === s.lv.length) el.innerHTML = "<b>모든 급수 끝!</b> 🎉";
      else if (done > 0) el.innerHTML = `<b>${done}개 급수</b> 끝냈어요`;
    }
  } catch (e) {}
  // 단어 퀴즈: Week 1~12, Week마다 오늘의 단어 + 최종 평가
  try {
    let fin = 0;
    for (let n = 1; n <= 12; n++) { const s = JSON.parse(localStorage.getItem("word-quiz-week" + n + "-v2")); if (s && s.days && s.days.every(d => d.done)) fin++; }
    if (fin) document.getElementById("p-word").innerHTML = fin === 12 ? "<b>12주 모두 끝!</b> 🎉" : `<b>Week ${fin}개</b> 끝냈어요`;
  } catch (e) {}})();
</script>
</body>
